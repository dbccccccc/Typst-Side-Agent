name: Release to Chrome Web Store

# Publishes only when a GitHub Release is published and is NOT marked pre-release.
# Pre-releases (e.g. v1.0.0-beta.1) and tag-only pushes do not trigger this workflow.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run audit:release
      - run: npm run verify
      - name: Install browser smoke dependencies
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Browser smoke (first pass)
        run: npm run test:browser
      - name: Browser smoke (second pass)
        run: npm run test:browser

      - name: Build extension zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run package -- --expected-tag "$RELEASE_TAG"
      - run: npm run package:check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typst-side-agent-release
          path: typst-side-agent.zip
          retention-days: 90

  publish:
    if: ${{ !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    # Approval and store credentials are requested only after verification.
    environment: chrome-web-store
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: typst-side-agent-release

      - name: Upload and publish to Chrome Web Store
        uses: browser-actions/release-chrome-extension@bde2f9ad09b20a52d4e71eca4a9daf99d412a8d9 # v0
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          extension-path: typst-side-agent.zip
          oauth-client-id: ${{ secrets.CHROME_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          oauth-refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
