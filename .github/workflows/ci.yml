name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run audit:release
      - run: npm run verify
      - name: Install browser smoke dependencies
        if: ${{ matrix.node-version == '24' }}
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Browser smoke (first pass)
        if: ${{ matrix.node-version == '24' }}
        run: npm run test:browser
      - name: Browser smoke (second pass)
        if: ${{ matrix.node-version == '24' }}
        run: npm run test:browser

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - run: npm ci

      - name: Build unpacked extension zip
        run: npm run package && npm run package:check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typst-side-agent-unpacked
          path: typst-side-agent.zip
          retention-days: 14
