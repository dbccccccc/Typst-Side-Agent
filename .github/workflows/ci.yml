name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run audit:release
      - run: npm run verify
      - name: Install browser smoke dependencies
        if: ${{ matrix.node-version == '24' }}
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Browser smoke (first pass)
        if: ${{ matrix.node-version == '24' }}
        run: npm run test:browser
      - name: Browser smoke (second pass)
        if: ${{ matrix.node-version == '24' }}
        run: npm run test:browser

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: npm ci

      - name: Build unpacked extension zip
        run: npm run package && npm run package:check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typst-side-agent-unpacked
          path: typst-side-agent.zip
          retention-days: 14
